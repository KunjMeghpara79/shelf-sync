spring.application.name=ShelfSync
spring.datasource.url=jdbc:mysql://localhost:3306/library_system
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
jwt.secret=YOUR_JWT_SECRET
jwt.expiration=YOUR_JWT_EXPIRATION
loan.fine.fixedrate=YOUR_FINE_FIXEDRATE
member.fine.threshold=YOUR_FINE_THRESHOLD
admin.email=ADMIN_EMAIL
admin.password=ADMIN_PASSWORD